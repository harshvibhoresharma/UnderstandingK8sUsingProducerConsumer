# KEDA ScaledObject — watches Redis queue length and scales consumer pods
# Install KEDA first:
#   kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
#
# How it works:
#   - Queue length 0        → 0 pods (scales to zero when idle)
#   - Queue length 1-10     → 1 pod
#   - Queue length 11-20    → 2 pods
#   - Queue length 91-100   → 10 pods (max)
#   Each pod handles ~10 tasks before KEDA adds another

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: consumer-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: consumer
  minReplicaCount: 0    # scale to zero when queue is empty (saves resources)
  maxReplicaCount: 10
  cooldownPeriod: 30    # wait 30s before scaling down (avoid flapping)
  triggers:
    - type: redis
      metadata:
        address: redis-service.default.svc.cluster.local:6379
        listName: tasks
        listLength: "10"   # add 1 pod for every 10 tasks in queue
